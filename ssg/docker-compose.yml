services:
  collectives-ssg-renderer:
    build: .
    image: nextcloud/collectives-ssg-renderer:latest
    container_name: collectives-ssg-renderer
    ports:
      - "${COLLECTIVES_SSG_PORT:-8080}:8080"
    environment:
      # Shared secret; must match the value configured in the Collectives admin
      # settings. Leave empty to disable authentication (development only).
      COLLECTIVES_SSG_SECRET: "${COLLECTIVES_SSG_SECRET:-}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/health') ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 3
