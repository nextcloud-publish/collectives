<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
	<style>
		:root { --border: #d0d7de; --sidebar-bg: #f6f8fa; --accent: #0969da; --text: #1f2328; --muted: #656d76; }
		* { box-sizing: border-box; }
		body { margin: 0; font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; color: var(--text); background: #fff; }
		a { color: var(--accent); text-decoration: none; }
		a:hover { text-decoration: underline; }
		.site-header { padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--sidebar-bg); font-weight: 600; }
		.layout { display: flex; align-items: flex-start; min-height: calc(100vh - 49px); }
		.sidebar { flex: 0 0 260px; padding: 16px; background: var(--sidebar-bg); border-right: 1px solid var(--border); position: sticky; top: 0; max-height: 100vh; overflow-y: auto; font-size: 14px; }
		.sidebar ul { list-style: none; margin: 0; padding-left: 14px; }
		.sidebar > ul { padding-left: 0; }
		.sidebar li { margin: 2px 0; }
		.content { flex: 1; padding: 24px 32px; max-width: 900px; }
		.content h1 { margin-top: 0; font-size: 2em; border-bottom: 1px solid var(--border); padding-bottom: 0.3em; }
		.content img { max-width: 100%; }
		.content pre { background: var(--sidebar-bg); padding: 12px; overflow-x: auto; border-radius: 6px; border: 1px solid var(--border); }
		.content code { background: var(--sidebar-bg); padding: 0.1em 0.35em; border-radius: 4px; font-size: 0.9em; }
		.content pre code { background: none; padding: 0; }
		.content blockquote { border-left: 3px solid var(--border); margin-left: 0; padding-left: 14px; color: var(--muted); }
		@media (max-width: 768px) {
			.layout { flex-direction: column; }
			.sidebar { position: static; max-height: none; width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
		}
	</style>
</head>
<body>
	<header class="site-header"><a href="{{ "/" | relURL }}">{{ .Site.Title }}</a></header>
	<div class="layout">
		<nav class="sidebar" aria-label="Pages">{{ partial "tree.html" .Site.Home }}</nav>
		<main class="content">{{ block "main" . }}{{ end }}</main>
	</div>
</body>
</html>
